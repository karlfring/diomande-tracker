name: Ingestion des matchs

on:
  # Lundi et jeudi matin : couvre les matchs du week-end et de milieu de
  # semaine. Activé une fois l'accès à la saison en cours vérifié.
  # schedule:
  #   - cron: "23 6 * * 1,4"
  workflow_dispatch:
    inputs:
      saison:
        description: "Saison (année de début) : 2025 = RB Leipzig, 2026 = Real Madrid"
        required: true
        default: "2026"
        type: choice
        options: ["2025", "2026"]

jobs:
  ingerer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
      DIOMANDE_SEASON: ${{ inputs.saison || '2026' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Ingestion
        run: python src/ingest.py

      - name: Fichier du tableau de bord
        run: python src/export_dashboard.py

      - name: Commit des nouvelles données
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucun nouveau match."
          else
            git commit -m "data: saison ${DIOMANDE_SEASON}, matchs au $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
