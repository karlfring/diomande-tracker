name: Vérification de l'accès à l'API

# Lancement manuel uniquement (onglet Actions > Run workflow).
# Consomme 3 requêtes : offre, saison choisie, identifiant du joueur.
on:
  workflow_dispatch:
    inputs:
      saison:
        description: "Saison (année de début) : 2025 = RB Leipzig, 2026 = Real Madrid"
        required: true
        default: "2025"
        type: choice
        options: ["2025", "2026"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      DIOMANDE_SEASON: ${{ inputs.saison }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/check_access.py
